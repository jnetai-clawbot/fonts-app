name: Build APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build debug APK
        run: ./gradlew assembleDebug
        env:
          KEYSTORE_PATH: ../keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ../keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Copy APK to apk folder
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/FontsApp.apk
          cp app/build/outputs/apk/release/app-release.apk apk/FontsApp-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FontsApp-APK
          path: apk/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: apk/FontsApp.apk
          name: "FontsApp ${{ github.ref_name }}"
          body: |
            ## FontsApp ${{ github.ref_name }}
            
            Font styling app for Android with 50+ decorative fonts, symbols, emojis, and text transformations.
            
            ### Features
            - 50+ decorative Unicode fonts
            - Symbols and emoji picker
            - Text transformations (flip, reverse)
            - Favourite fonts
            - Dark/Light mode
            - Custom font upload
            - Save/Load text
            
            Made by jnetai.com
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
